<!doctype html>
<html lang="PT-Br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pagina Clientes</title>
    <link rel="stylesheet" href="dashboardClientes.css" />
  </head>
  <body>
    <!-- Menu lateral -->
    <aside class="sidebar">
      <h2>DASHBOARD</h2>
      <ul>
        <li>Dashboard</li>
        <li>Clientes</li>
        <li>Modulos</li>
        <li>Messages</li>
        <li>Sair</li>
      </ul>
    </aside>

    <!-- Conteúdo principal -->
    <main>
      <div class="container">
        <h1>Clientes</h1>
        <!-- Botão para abrir modal -->
        <button class="btn-add" onclick="openModal()">
          + Adicionar Cliente
        </button>

        <!-- Lista de clientes (começa vazia) -->
        <div id="lista-clientes"></div>
      </div>

      <!-- Modal de cadastro -->
      <div id="modal" class="modal">
        <div class="modal-content">
          <button class="btn-close" onclick="closeModal()">X</button>
          <h2>Cadastrar Cliente</h2>
          <input type="text" id="nome" placeholder="Nome" />
          <input type="text" id="nomeEmpresa" placeholder="Nome da Empresa" />
          <input type="email" id="email" placeholder="E-mail" />
          <input type="text" id="telefone" placeholder="Telefone" />
          <input type="text" id="endereco" placeholder="Endereço" />

          <button class="btn-save" onclick="salvarCliente()">Salvar</button>
        </div>
      </div>
    </main>

    <!-- Script -->
    <script src="dashboardClientes.js"></script>
  </body>
</html>
